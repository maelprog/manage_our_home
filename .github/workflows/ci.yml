name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Deux des quatre portes dépendent de choses qui bougent hors du dépôt :
  # `dtolnay/rust-toolchain@stable` suit la stable du jour, et `cargo audit`
  # suit la base d'avis RustSec. `main` peut donc virer au rouge sans qu'une
  # ligne ait changé, et les deux autres déclencheurs sont des événements de
  # code : rien ne permettait de rejouer les portes sur `main` sans y pousser
  # un commit. C'est ainsi que #93 a été découverte — deux portes rouges sur
  # du code identique à `main`, trouvées par accident en tentant un merge.
  # Le bouton « Run workflow » de la page Actions est le seul levier de
  # visibilité restant : épingler le toolchain a été écarté par arbitrage le
  # 2026-08-29, et #121 ne rouvre pas cette décision.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  fmt-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # --all-targets so the lint gate also covers `cfg(test)` code: the
      # `mod tests` blocks and the `tests/*.rs` binaries. Without it clippy
      # only sees the lib/bin targets, so a real defect can sit on a branch
      # with every gate green — #98 pushed a commit carrying an `items after
      # a test module` that this gate reported clean. It was caught in review
      # before merge, by running the command by hand, not by CI (issue #102).
      - run: cargo clippy --workspace --all-targets -- -D warnings

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The agenda suite asserts on the actual stored objects, not just the
      # `event_attachments` rows (issue #54: deleting an event used to leave
      # its objects behind, and only a real bucket can catch that). Tests
      # needing MinIO skip themselves when these vars are unset, so a bare
      # `cargo test` against Postgres alone still passes locally.
      - name: Start MinIO and create the attachments bucket
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ci-dummy \
            -e MINIO_ROOT_PASSWORD=ci-dummy-secret \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/ready && break
            sleep 1
          done
          docker run --rm --network host --entrypoint /bin/sh minio/mc -c \
            "mc alias set local http://localhost:9000 ci-dummy ci-dummy-secret && \
             mc mb -p local/manage-our-home"
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
        env:
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ACCESS_KEY: ci-dummy
          MINIO_SECRET_KEY: ci-dummy-secret
          MINIO_BUCKET: manage-our-home

  # Playwright E2E against a live apps/web + apps/api + Postgres + MinIO
  # stack — merge gate per docs/v1-scope.md's "Playwright policy" (every
  # front epic ships its journeys here, F1/issue #15 established it). SMTP
  # points at nothing reachable on purpose (handlers log and swallow email
  # send failures); the suite reads verification/reset tokens straight from
  # Postgres (e2e/lib/db.ts), same mechanism as apps/api/tests/*_flow.rs.
  # MinIO is real (started below) because the Agenda epic (F3/#18) uploads
  # and downloads event attachments — the first front epic to touch object
  # storage.
  # The Google Calendar epic (F11/#52) needs no extra service: its suite starts
  # its own throwaway ICS fixture server inside the Playwright process and points
  # the connection at it (apps/api's validate_feed_url accepts http:// for
  # exactly this). apps/api is the client of that server, and both run on this
  # runner, so the default 127.0.0.1 host works — no ICS_FIXTURE_HOST needed
  # here. CALENDAR_FEED_ENCRYPTION_KEY is already set below.
  # The Messagerie epic (F8/#23) adds the first browser→apps/api WebSocket:
  # the live-updates test opens `GET /groups/:id/messages/ws` straight against
  # apps/api using API_PUBLIC_BASE_URL (http://localhost:8080 here), so that URL
  # must stay browser-reachable from the Playwright process, and apps/api needs
  # MESSAGE_ENCRYPTION_KEY set (below) to encrypt/decrypt message content.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # e2e/package.json has declared `engines: {"node": ">=22.18.0"}` since
      # #85 (2026-07-31): the scripts under e2e/scripts/ are TypeScript
      # executed straight by node (needs >= 22.18) and use
      # `zlib.zstdCompressSync` (>= 22.15). Pinning 20 here is what kept
      # `npm run test:scripts` out of this job from that day until #91 --
      # about five weeks.
      # Separately, and for much longer: Node 20 reached end of life on
      # 2026-04-30, so this job had been running on an unpatched runtime for
      # over four months. Two different clocks; #91 only owns the first.
      # 24 rather than the 22.18 floor: Node 24 is supported until 2028-04-30
      # (22 entered maintenance on 2025-10-21), and Node 24 is what the
      # Playwright image matching the pinned @playwright/test carries
      # (v1.61.1-noble -> Node 24.17; older tags do not -- v1.55.0-noble is
      # still on 22.18). Local runs already use that image, so raising this
      # line removes a CI/local divergence rather than creating one.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      # `npm ci` and the pure-logic script tests run here, before the stack is
      # built and started, on purpose. e2e/scripts/lib/*.test.ts and
      # e2e/lib/*.test.ts exercise the seed/measure/date logic only: no
      # Postgres, no MinIO, no browser. Placed after "Wait for both services"
      # they would be hidden by any stack that fails to come up -- the failure
      # mode this job is most prone to -- and a lockfile or engines problem
      # would only surface after the cargo build. Here they report either way.
      #
      # "Here they report either way" was half true until #123: `node --test`
      # exits 0 when its globs match no file, so this step was green on zero
      # executed tests and a renamed directory would have removed the whole
      # suite in silence. `npm run test:scripts` now goes through
      # e2e/scripts/run-script-tests.mjs, which fails under one executed test.
      - run: npm ci
        working-directory: e2e
      - run: npm run test:scripts
        working-directory: e2e
      - run: cargo build -p manage_our_home -p manage_our_home_web
      - name: Start MinIO and create the attachments bucket
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ci-dummy \
            -e MINIO_ROOT_PASSWORD=ci-dummy-secret \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/ready && break
            sleep 1
          done
          docker run --rm --network host --entrypoint /bin/sh minio/mc -c \
            "mc alias set local http://localhost:9000 ci-dummy ci-dummy-secret && \
             mc mb -p local/manage-our-home"
      - name: Start apps/api (applies migrations on boot)
        run: ./target/debug/manage_our_home &
        env:
          PUBLIC_BASE_URL: http://localhost:8080
          FRONTEND_BASE_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci-dummy
          GOOGLE_CLIENT_SECRET: ci-dummy
          OAUTH_ENCRYPTION_KEY: ci-dummy-oauth-key
          MESSAGE_ENCRYPTION_KEY: ci-dummy-message-key
          CALENDAR_FEED_ENCRYPTION_KEY: ci-dummy-calendar-key
          SECURE_COOKIES: "false"
          SMTP_HOST: localhost
          SMTP_USERNAME: ci-dummy
          SMTP_PASSWORD: ci-dummy
          SMTP_FROM: Manage Our Home <no-reply@example.test>
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ACCESS_KEY: ci-dummy
          MINIO_SECRET_KEY: ci-dummy-secret
          MINIO_BUCKET: manage-our-home
      - name: Start apps/web
        run: ./target/debug/manage_our_home_web &
        env:
          API_INTERNAL_BASE_URL: http://localhost:8080
          API_PUBLIC_BASE_URL: http://localhost:8080
          WEB_BIND_ADDR: 0.0.0.0:3000
      - name: Wait for both services
        run: |
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:8080/auth/me \
              && curl -s -o /dev/null http://localhost:3000/login \
              && exit 0
            sleep 1
          done
          echo "stack did not come up in 60s" >&2
          exit 1
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
        env:
          WEB_BASE_URL: http://localhost:3000
