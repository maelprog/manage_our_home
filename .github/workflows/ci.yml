name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  fmt-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- -D warnings

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  # Playwright E2E against a live apps/web + apps/api + Postgres stack —
  # merge gate per docs/v1-scope.md's "Playwright policy" (every front
  # epic ships its journeys here, F1/issue #15 established it). SMTP/MinIO
  # point at nothing reachable on purpose: handlers log and swallow email
  # send failures, and no Auth journey touches object storage; the E2E
  # suite reads verification/reset tokens straight from Postgres
  # (e2e/lib/db.ts), same mechanism as apps/api/tests/*_flow.rs.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: cargo build -p manage_our_home -p manage_our_home_web
      - name: Start apps/api (applies migrations on boot)
        run: ./target/debug/manage_our_home &
        env:
          PUBLIC_BASE_URL: http://localhost:8080
          FRONTEND_BASE_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci-dummy
          GOOGLE_CLIENT_SECRET: ci-dummy
          OAUTH_ENCRYPTION_KEY: ci-dummy-oauth-key
          MESSAGE_ENCRYPTION_KEY: ci-dummy-message-key
          CALENDAR_FEED_ENCRYPTION_KEY: ci-dummy-calendar-key
          SECURE_COOKIES: "false"
          SMTP_HOST: localhost
          SMTP_USERNAME: ci-dummy
          SMTP_PASSWORD: ci-dummy
          SMTP_FROM: Manage Our Home <no-reply@example.test>
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ACCESS_KEY: ci-dummy
          MINIO_SECRET_KEY: ci-dummy
          MINIO_BUCKET: manage-our-home
      - name: Start apps/web
        run: ./target/debug/manage_our_home_web &
        env:
          API_INTERNAL_BASE_URL: http://localhost:8080
          API_PUBLIC_BASE_URL: http://localhost:8080
          WEB_BIND_ADDR: 0.0.0.0:3000
      - name: Wait for both services
        run: |
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:8080/auth/me \
              && curl -s -o /dev/null http://localhost:3000/login \
              && exit 0
            sleep 1
          done
          echo "stack did not come up in 60s" >&2
          exit 1
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
        env:
          WEB_BASE_URL: http://localhost:3000
