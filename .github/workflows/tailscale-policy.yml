name: Tailscale policy

# The staging tailnet's access policy (#684, docs/staging-tailscale.md).
# The offline check — the file's own `tests` block, and what keeps it
# publishable — is a unit test of the `manage_our_home_tailnet_policy`
# crate, run by the `test` job of ci.yml like any other. This workflow adds
# what needs the coordinator, and so a credential:
#   - `validate` asks Tailscale to validate the policy, its tests included,
#     on every change to it;
#   - `apply` replaces the tailnet's policy, by hand only (Run workflow,
#     `apply` ticked, from main): like a change to the `deploy` branch,
#     reaching the infrastructure is the user's act, not a merge's.
# The groups' members are not in the repository, which is public: they come
# from the TS_ACL_GROUPS secret.

on:
  pull_request:
    paths:
      - "infra/tailscale/**"
      - ".github/workflows/tailscale-policy.yml"
  push:
    branches: [main]
    paths:
      - "infra/tailscale/**"
      - ".github/workflows/tailscale-policy.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Remplacer la politique du tailnet par celle de main"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tailscale-policy-${{ github.ref }}
  cancel-in-progress: false

env:
  TS_ACL_GROUPS: ${{ secrets.TS_ACL_GROUPS }}
  TS_API_KEY: ${{ secrets.TS_API_KEY }}
  TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
  TS_OAUTH_CLIENT_SECRET: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A pull request from a fork gets no secret, and the repository may
      # not hold them yet: the job then says so, in the run's annotations,
      # rather than turning red on every change. The offline check of ci.yml
      # still ran.
      - name: Validate with the coordinator
        run: |
          if [ -z "$TS_ACL_GROUPS" ] || { [ -z "$TS_API_KEY" ] && [ -z "$TS_OAUTH_CLIENT_SECRET" ]; }; then
            echo "::warning title=Tailscale policy::validation by the coordinator skipped: TS_ACL_GROUPS and a credential (TS_OAUTH_CLIENT_ID/TS_OAUTH_CLIENT_SECRET or TS_API_KEY) are needed"
            exit 0
          fi
          infra/tailscale/policy.sh validate

  apply:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.apply && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: infra/tailscale/policy.sh apply
