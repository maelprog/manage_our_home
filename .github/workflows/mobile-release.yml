# The signed Android APK, published as a GitHub release (#666).
#
# A tag mobile-vX.Y.Z builds the staging flavour in release, signs it with the
# release key, checks the signature against the certificate fingerprint
# recorded in apps/mobile/README.md, and publishes the APK and its SHA-256
# in a release of that tag. The families install it by hand, and every
# later release installs over it as long as it is signed with the same key
# and its versionCode is higher (scripts/release-version.mjs refuses a tag
# that is not above every mobile-v tag already there).
#
# What the user sets up once (apps/mobile/README.md, « Publier un APK
# signé »):
# - secret MHOME_KEYSTORE_BASE64: the PKCS12 keystore, base64-encoded;
# - secret MHOME_KEYSTORE_PASSWORD: its password;
# Missing any of them stops the run at its first step, saying which.
#
# A tag mobile-v… does not start with v: images.yml and promote.yml, which
# follow v* tags, are not triggered.
#
# Started by hand (workflow_dispatch, #742) with the SHA of a commit of
# main, it releases that commit under the next tag: mobile-v0.1.0 when there
# is no mobile-v tag, else the patch after the highest one in SemVer order
# (scripts/release-version.mjs --next). The release creates the tag, through
# the API with github.token: a tag created that way starts no workflow, so
# this one does not run a second time for it. A commit that already has a
# mobile-v tag is not released again: the run ends green, with nothing
# published. Another workflow that wants a release dispatches this one: a
# tag it pushed with GITHUB_TOKEN would start nothing.

name: Mobile release

on:
  push:
    tags: ["mobile-v*"]
  workflow_dispatch:
    inputs:
      sha:
        description: Full SHA of the commit of main to release
        required: true
        type: string

# Nothing by default; the job below asks for what it uses.
permissions: {}

# Two releases at once would each check the other's tag as already there,
# and two dispatches would compute the same next tag.
concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  # The tag to release, and on a dispatch the commit: the pushed tag as it
  # is, or the next one for a commit of main that has none. No tag means
  # nothing to publish, and the release job is skipped.
  target:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      # Every branch and tag: main for the ancestry check, the mobile-v tags
      # for the next one.
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Tag and commit
        id: target
        env:
          EVENT: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
          SHA: ${{ inputs.sha }}
        run: |
          if [ "$EVENT" != workflow_dispatch ]; then
            echo "tag=$PUSHED_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$SHA" | grep -qxE '[0-9a-f]{40}'; then
            echo "::error::input sha: expected the full SHA of a commit of main, 40 lowercase hexadecimal characters"
            exit 1
          fi
          if ! git cat-file -e "$SHA^{commit}" 2>/dev/null; then
            echo "::error::commit $SHA is not in the repository"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::commit $SHA is not on main: only a commit of main is released"
            exit 1
          fi
          already=$(git tag --points-at "$SHA" --list 'mobile-v*' | paste -sd ' ' -)
          if [ -n "$already" ]; then
            echo "::notice::commit $SHA already has $already: nothing to publish"
            exit 0
          fi
          mapfile -t tags < <(git tag --list 'mobile-v*')
          node apps/mobile/scripts/release-version.mjs --next "${tags[@]}" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  release:
    needs: target
    if: needs.target.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      # gh release create, and on a dispatch the tag it creates.
      contents: write
    defaults:
      run:
        working-directory: apps/mobile
    env:
      TAG: ${{ needs.target.outputs.tag }}
      # Empty for a pushed tag.
      TARGET_SHA: ${{ needs.target.outputs.sha }}
    steps:
      - name: Signing secrets
        env:
          MHOME_KEYSTORE_BASE64: ${{ secrets.MHOME_KEYSTORE_BASE64 }}
          MHOME_KEYSTORE_PASSWORD: ${{ secrets.MHOME_KEYSTORE_PASSWORD }}
        working-directory: .
        run: |
          missing=0
          for name in MHOME_KEYSTORE_BASE64 MHOME_KEYSTORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is not set (Settings → Secrets and variables → Actions → Secrets; apps/mobile/README.md, « Publier un APK signé »)"
              missing=1
            fi
          done
          exit "$missing"

      # Every tag, for the versionCode check. No persisted credentials: the
      # only write, the release, goes through GH_TOKEN below. The pushed tag
      # (ref empty), or the dispatched commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      # No dependency cache: a release build starts from the lockfile alone.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Capacitor 8 builds with Java 21 (its capacitor.build.gradle sets
      # sourceCompatibility 21).
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Version from the tag
        id: version
        run: |
          mapfile -t tags < <(git tag --list 'mobile-v*')
          node scripts/release-version.mjs "$TAG" "${tags[@]}" >> "$GITHUB_OUTPUT"

      - name: Expected certificate
        id: certificate
        run: |
          # shellcheck disable=SC2016 # the backquotes are the README's, not command substitutions
          line=$(grep -E '^Empreinte SHA-256 du certificat de signature : `([0-9A-Fa-f]{2}:){31}[0-9A-Fa-f]{2}`$' README.md || true)
          if [ -z "$line" ]; then
            echo "::error::apps/mobile/README.md records no certificate fingerprint: the line « Empreinte SHA-256 du certificat de signature : \`AA:BB:…\` » (keytool -list -v) has to be committed before the first release"
            exit 1
          fi
          fingerprint=$(printf '%s' "$line" | grep -oE '([0-9A-Fa-f]{2}:){31}[0-9A-Fa-f]{2}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "sha256=$fingerprint" >> "$GITHUB_OUTPUT"

      - run: npm ci
      # Blocking, no ignore list, as in the mobile job of ci.yml.
      - run: npm audit --audit-level=high
      - run: npm test

      # No MHOME_TARGET: the default target is the staging server.
      - name: Sync the staging target
        run: npx cap sync android

      - name: Build and sign
        env:
          MHOME_KEYSTORE_BASE64: ${{ secrets.MHOME_KEYSTORE_BASE64 }}
          MHOME_KEYSTORE_PASSWORD: ${{ secrets.MHOME_KEYSTORE_PASSWORD }}
          MHOME_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        working-directory: apps/mobile/android
        run: |
          printf '%s' "$MHOME_KEYSTORE_BASE64" | base64 --decode > "$MHOME_KEYSTORE_FILE"
          trap 'rm -f "$MHOME_KEYSTORE_FILE"' EXIT
          ./gradlew assembleStagingRelease --no-daemon \
            -PmhomeVersionName="$VERSION_NAME" -PmhomeVersionCode="$VERSION_CODE"

      - name: Check the APK
        env:
          EXPECTED_SHA256: ${{ steps.certificate.outputs.sha256 }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          apk=android/app/build/outputs/apk/staging/release/app-staging-release.apk
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          # "Signer #1 certificate" under v1 (JAR) signing, "V2 Signer: certificate"
          # (V3…) when the APK carries only an APK Signature Scheme signature.
          signed=$(sed -nE 's/^(Signer #1|V[0-9.]+ Signer:) certificate SHA-256 digest: ([0-9a-f]{64})$/\2/p' "$RUNNER_TEMP/certs.txt" | head -n 1)
          if ! grep -qx 'Number of signers: 1' "$RUNNER_TEMP/certs.txt" || [ "$signed" != "$EXPECTED_SHA256" ]; then
            echo "::error::the APK is signed by certificate ${signed:-none}, not the one apps/mobile/README.md records ($EXPECTED_SHA256): the secret MHOME_KEYSTORE_BASE64 holds another key"
            exit 1
          fi
          "$build_tools/aapt2" dump badging "$apk" | head -n 1 | tee "$RUNNER_TEMP/badging.txt"
          expected="package: name='fr.watallo.mhome.staging' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'"
          if ! grep -qF "$expected" "$RUNNER_TEMP/badging.txt"; then
            echo "::error::expected $expected"
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          CERT_SHA256: ${{ steps.certificate.outputs.sha256 }}
        run: |
          dir="$RUNNER_TEMP/release"
          mkdir -p "$dir"
          name="mhome-$VERSION_NAME.apk"
          cp android/app/build/outputs/apk/staging/release/app-staging-release.apk "$dir/$name"
          (cd "$dir" && sha256sum "$name" > "$name.sha256")
          cat > "$dir/notes.md" <<EOF
          Application Android de MHome, version $VERSION_NAME (versionCode $VERSION_CODE).

          - SHA-256 de l'APK : \`$(cut -d' ' -f1 "$dir/$name.sha256")\`
          - SHA-256 du certificat de signature : \`$CERT_SHA256\`

          Installation et vérification : [apps/mobile/README.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/apps/mobile/README.md#installer-lapplication-familles).
          EOF
          if [ -z "$TARGET_SHA" ]; then
            # The pushed tag.
            where=(--verify-tag)
          else
            # The tag is created with the release, on the dispatched commit.
            # Pushed meanwhile, it would be on another commit.
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::tag $TAG was pushed while this run built it: start the release again"
              exit 1
            fi
            where=(--target "$TARGET_SHA")
          fi
          gh release create "$TAG" "$dir/$name" "$dir/$name.sha256" \
            --repo "$GITHUB_REPOSITORY" "${where[@]}" \
            --title "MHome Android $VERSION_NAME" --notes-file "$dir/notes.md"
