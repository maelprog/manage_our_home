# Builds, scans and — when asked — publishes, signs and attests one image
# (#430). Called by images.yml, once per component; never triggered on its
# own.
#
# Order of the steps, and why: the image is built into the runner's Docker
# store, scanned and inventoried there, and only then pushed, so what lands
# on GHCR is byte for byte what Trivy passed — a CRITICAL fixable finding
# stops the job before anything is published. The digest the registry
# returns is the one every later step (signature, SBOM attestation,
# provenance) and the job output refer to: a tag can be moved, a digest
# cannot.
#
# Tools: Trivy and Syft run from their images, pinned by digest, on a
# `docker save` archive mounted read-only — neither gets the Docker socket.
# Actions are pinned by commit SHA (the tag in the trailing comment is what
# that SHA was when pinned): this job holds `packages: write` and an OIDC
# token, so a repointed action tag would run with both.

name: Image build

on:
  workflow_call:
    inputs:
      component:
        description: "api or web: picks apps/<component>/Dockerfile and the image name."
        required: true
        type: string
      publish:
        description: "Push to GHCR, sign, attest. False on pull requests: build and scan only."
        required: true
        type: boolean
    outputs:
      digest:
        description: "Digest of the published image (sha256:…), empty when publish is false."
        value: ${{ jobs.image.outputs.digest }}
      image:
        description: "Image name on GHCR, without tag or digest."
        value: ${{ jobs.image.outputs.image }}

# No `permissions:` here on purpose: a called workflow inherits those of
# the calling job (images.yml), and declaring more than a caller grants
# makes the run fail to start. With publish, the caller grants
# contents: read (checkout), packages: write (push to GHCR, signatures and
# attestations stored next to the image), id-token: write (keyless cosign
# signature and provenance through the GitHub OIDC token) and
# attestations: write (the provenance attestation API); without, only
# contents: read.

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.name.outputs.image }}
    env:
      COMPONENT: ${{ inputs.component }}
      TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
      SYFT_IMAGE: anchore/syft:v1.52.0@sha256:500e2d872ac019436926e8322b4fc1f39441d94d21f6f4046c6ff29b30e8cb02
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name and tags
        id: name
        run: |
          case "$COMPONENT" in
            api|web) ;;
            *) echo "::error::unknown component '$COMPONENT'"; exit 1 ;;
          esac
          # GHCR wants a lowercase repository path; an owner name may not be.
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/manage-our-home-${COMPONENT}"
          tags="${image}:sha-${GITHUB_SHA}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags="${tags} ${image}:${GITHUB_REF_NAME}"
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          docker build \
            --platform linux/amd64 \
            --file "apps/${COMPONENT}/Dockerfile" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE}:sha-${GITHUB_SHA}" \
            .
          docker save --output "${RUNNER_TEMP}/image.tar" "${IMAGE}:sha-${GITHUB_SHA}"

      # The acceptance criterion of #430: the image runs as a non-root UID on
      # a read-only root filesystem. `id -u` goes through the image's own
      # user, not a --user override, so a Dockerfile that lost its USER line
      # fails here.
      - name: Non-root on a read-only filesystem
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          uid=$(docker run --rm --read-only --tmpfs /tmp "${IMAGE}:sha-${GITHUB_SHA}" id -u)
          echo "uid=${uid}"
          if [ "$uid" = 0 ]; then
            echo "::error::the ${COMPONENT} image runs as root"
            exit 1
          fi

      # Fails on a CRITICAL vulnerability that has a fixed version
      # (--ignore-unfixed): those are the ones a rebuild on a newer base
      # digest, or a dependency bump, can actually clear. A CRITICAL with no
      # fix anywhere would only block every publish with nothing to do about
      # it. HIGH and below are not gated.
      - name: Trivy scan
        run: |
          docker run --rm \
            --volume "${RUNNER_TEMP}/image.tar:/in/image.tar:ro" \
            "$TRIVY_IMAGE" image \
              --input /in/image.tar \
              --scanners vuln \
              --severity CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --no-progress

      - name: SBOM (Syft, SPDX JSON)
        run: |
          mkdir -p "${RUNNER_TEMP}/sbom"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "${RUNNER_TEMP}/image.tar:/in/image.tar:ro" \
            --volume "${RUNNER_TEMP}/sbom:/out" \
            "$SYFT_IMAGE" scan docker-archive:/in/image.tar \
              --output spdx-json=/out/sbom.spdx.json
          test -s "${RUNNER_TEMP}/sbom/sbom.spdx.json"

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push
        id: push
        if: inputs.publish
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          TAGS: ${{ steps.name.outputs.tags }}
        run: |
          for tag in $TAGS; do
            if [ "$tag" != "${IMAGE}:sha-${GITHUB_SHA}" ]; then
              docker tag "${IMAGE}:sha-${GITHUB_SHA}" "$tag"
            fi
            docker push "$tag"
          done
          # The repository digest of what was pushed — every tag points at it.
          ref=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${IMAGE}:sha-${GITHUB_SHA}" | grep "^${IMAGE}@sha256:" | head -n 1)
          digest="${ref#"${IMAGE}@"}"
          case "$digest" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "::error::no registry digest for ${IMAGE} (got '${ref}')"; exit 1 ;;
          esac
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "### ${COMPONENT}"
            echo
            echo "\`${IMAGE}@${digest}\`"
            echo
            echo "Tags: \`${TAGS}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: inputs.publish

      # Keyless: the certificate Fulcio issues names this workflow file and
      # the ref it ran on, through the GitHub OIDC token. To check it:
      #   cosign verify <image>@<digest> \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --certificate-identity-regexp '^https://github.com/<owner>/manage_our_home/\.github/workflows/image-build\.yml@refs/(heads/main|tags/v.*)$'
      - name: Sign, attach the SBOM as an attestation
        if: inputs.publish
        env:
          REF: ${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson \
            --predicate "${RUNNER_TEMP}/sbom/sbom.spdx.json" "$REF"

      - name: Provenance attestation
        if: inputs.publish
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
