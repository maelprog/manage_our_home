# A throwaway object store for the k3d job only (#433): where staging's
# Postgres sends its WAL and base backups during the job, and where the
# restore drill of ci/postgres-test.sh reads them back. No volume: it lives
# as long as the cluster.
#
# Same image and pin as the "Start MinIO" step of ci.yml on main. The
# bucket `ci-backups` is created by the image itself (MINIO_DEFAULT_BUCKETS);
# the credentials come from the Secret `minio`, generated by the job.
apiVersion: v1
kind: Namespace
metadata:
  name: ci-minio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: ci-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: docker.io/bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: {name: minio, key: MINIO_ROOT_USER}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: minio, key: MINIO_ROOT_PASSWORD}
            - name: MINIO_DEFAULT_BUCKETS
              value: ci-backups
          ports:
            - containerPort: 9000
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: 9000}
            periodSeconds: 2
          resources:
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: ci-minio
spec:
  selector:
    app: minio
  ports:
    - port: 9000
