# A throwaway Postgres for the k3d job only (ci/staging-smoke.sh) — never
# deployed anywhere else: no volume, no backup. The environments get
# theirs from CloudNativePG (#433).
#
# Same image and pin as infra/docker-compose.yml on main. Its roles are
# created by infra/postgres/init/01-roles.sh, taken from main by the job
# (ConfigMap `postgres-init`), so the RLS roles tested here are the ones
# the compose stack creates. The passwords come from the Secret
# `postgres`, generated by the job.
#
# In a namespace of its own: the official image starts as root, which the
# `restricted` Pod Security level of manage-our-home refuses.
apiVersion: v1
kind: Namespace
metadata:
  name: ci-postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ci-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16.15@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
          env:
            - name: POSTGRES_DB
              value: manage_our_home
            - name: POSTGRES_USER
              value: mhome
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres, key: POSTGRES_PASSWORD}
            - name: APP_ROLE_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres, key: APP_ROLE_PASSWORD}
            - name: MIGRATION_ROLE_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres, key: MIGRATION_ROLE_PASSWORD}
            - name: ADMIN_ROLE_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres, key: ADMIN_ROLE_PASSWORD}
          ports:
            - containerPort: 5432
          # Over TCP, as in infra/docker-compose.yml: during the first boot
          # the init scripts run against a server listening on the Unix
          # socket only.
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "mhome", "-d", "manage_our_home"]
            periodSeconds: 2
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ci-postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
