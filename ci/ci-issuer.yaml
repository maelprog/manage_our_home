# A self-signed ClusterIssuer for the k3d jobs. In the observability's
# (#437): the issuer of the short-lived certificate of
# ci/observability-fixtures.yaml, whose expiry alert that job fires. In
# staging's: the issuer of the application's certificate, in place of
# `letsencrypt-dns01`, which needs the real staging server's sealed
# Scaleway key and its public zone (ci/staging-smoke.sh, #683).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ci-selfsigned
spec:
  selfSigned: {}
