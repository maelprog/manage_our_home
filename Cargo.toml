[workspace]
resolver = "2"
members = ["apps/api", "apps/web", "apps/shared", "apps/http_guard", "infra/tailscale"]

# #765: RUSTSEC-2026-0459 (libsqlite3-sys < 0.39, the SQLite it bundles).
# apps/api enables sqlx's `postgres` driver only, so `sqlx-sqlite` and
# `libsqlite3-sys` are never compiled (`cargo tree -i sqlx-sqlite --target
# all --all-features` prints nothing). They still appear in Cargo.lock:
# sqlx's features name `sqlx-sqlite?/json`, `sqlx-sqlite?/chrono`… and
# Cargo locks an optional dependency that a weak `dep?/feature` names, even
# when nothing enables it (`sqlx-mysql` sits in the lock the same way).
# `cargo audit` reads the lock, so it reports the advisory all the same.
# sqlx 0.9.0, the newest release, caps libsqlite3-sys at `<0.38`; upstream
# raised the cap to `<0.40` in launchbadge/sqlx#4502, not released yet.
# This takes `sqlx-sqlite` alone from that commit, so the lock can resolve
# libsqlite3-sys 0.39: sqlx-core, sqlx-postgres and the macros — the code
# that is compiled — stay on the 0.9.0 release. Remove this patch once a
# sqlx release includes #4502, and move sqlx to that release.
[patch.crates-io]
sqlx-sqlite = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }

# The picture codecs, optimised in the dev profile that `cargo test` and
# `cargo nextest` build with (the test profile inherits it), and in that
# profile only: apps/api's avatar and apps/web's barcode photo decode and
# encode full camera frames in their tests, and at `opt-level = 0` those
# few tests took most of the `test` job (#606 — 161 s for
# `avatar_memory`'s one test on CI). An override per package changes how
# these crates are compiled, not what they do: no line of the apps, and
# no memory bound their tests assert, moves. `release` is untouched.
#
# Every other dependency at `opt-level = 1` (argon2 and blake2 among
# them, which the sign-in tests hash with on every call), the crates
# named below at 3: Cargo applies the override that names a package
# over the `"*"` one, and neither reaches the workspace's own crates.
# A change of these levels changes the rust-cache `key` in ci.yml too:
# the CI cache would otherwise keep the previous build.
[profile.dev.package."*"]
opt-level = 1
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.jpeg-decoder]
opt-level = 3
[profile.dev.package.jpeg-encoder]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
