# apps/api and apps/web (Front epic #1, GH issue #15) are now wired up.
# Both build contexts point at the repo root (`..`) because apps/api and
# apps/web each depend on apps/shared as a Cargo path dependency, not just
# their own directory.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: manage_our_home
      POSTGRES_USER: mom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on: [postgres, minio]
    environment:
      DATABASE_URL: postgres://mom:${POSTGRES_PASSWORD}@postgres/manage_our_home
      ADMIN_DATABASE_URL: postgres://admin_role:${ADMIN_ROLE_PASSWORD}@postgres/manage_our_home
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      FRONTEND_BASE_URL: ${PUBLIC_BASE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY}
      MESSAGE_ENCRYPTION_KEY: ${MESSAGE_ENCRYPTION_KEY}
      CALENDAR_FEED_ENCRYPTION_KEY: ${CALENDAR_FEED_ENCRYPTION_KEY}
      SECURE_COOKIES: "true"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: manage-our-home

  # apps/web's SSR layer calls apps/api over this internal Docker network
  # (service name `api`, not through Caddy) — see docs/architecture.md's
  # Deployment section and issue #15. The browser only ever talks to
  # apps/web directly, except for the Google OAuth redirect, which is
  # apps/api-hosted and reached through Caddy at /api/auth/google/*.
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_INTERNAL_BASE_URL: http://api:8080
      API_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}/api
      WEB_BIND_ADDR: 0.0.0.0:3000

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api, web]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  postgres_data:
  minio_data:
  ollama_data:
  caddy_data:
