# Scaffold only — apps/api and apps/web don't exist yet (see docs/v1-scope.md).
# Flesh out build contexts and env vars as those apps land.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: manage_our_home
      POSTGRES_USER: mom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  # api:
  #   build: ../apps/api
  #   restart: unless-stopped
  #   depends_on: [postgres, minio]
  #   environment:
  #     DATABASE_URL: postgres://mom:${POSTGRES_PASSWORD}@postgres/manage_our_home
  #     MINIO_ENDPOINT: http://minio:9000
  #     MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
  #     MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  #     MINIO_BUCKET: manage-our-home

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  postgres_data:
  minio_data:
  ollama_data:
  caddy_data:
