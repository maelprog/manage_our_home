# apps/api and apps/web (Front epic #1, GH issue #15) are now wired up.
# Both build contexts point at the repo root (`..`) because apps/api and
# apps/web each depend on apps/shared as a Cargo path dependency, not just
# their own directory.
services:
  postgres:
    # Deliberately left on the major series, not pinned to a patch release
    # (#160): 16 is the contract the migrations are played against and the
    # series the ci.yml jobs use, and PostgreSQL minor releases are fixes,
    # often security ones, that a patch pin would force us to chase by hand.
    # Changing series goes through e2e/scripts/lib/image-pins.ts.
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: manage_our_home
      POSTGRES_USER: mhome
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Consumed by postgres/init/01-roles.sh at first boot to create the two
      # BYPASSRLS roles behind MIGRATION_DATABASE_URL and ADMIN_DATABASE_URL.
      MIGRATION_ROLE_PASSWORD: ${MIGRATION_ROLE_PASSWORD}
      ADMIN_ROLE_PASSWORD: ${ADMIN_ROLE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  # Registry is quay.io, not Docker Hub: docker.io/minio/minio no longer
  # answers anonymous pulls (issue #157). The tag is pinned rather than
  # `latest` so the server cannot move under an existing stack unnoticed;
  # keep it in step with .github/workflows/ci.yml when bumping.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  # One-shot: creates the bucket the api expects (MINIO_BUCKET below) —
  # MinIO doesn't auto-create buckets and neither does the api's S3 client.
  # Idempotent (--ignore-existing), exits once done.
  # Same story as the minio service above: quay.io because Docker Hub no
  # longer serves this repo anonymously (issue #157), and a pinned tag
  # rather than `latest`. mc has its own release clock, so this stamp is
  # deliberately not the server's.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: [minio]
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\"; do sleep 1; done;
      mc mb --ignore-existing local/manage-our-home
      "

  # Dev-only mail catcher (COMPOSE_PROFILES=dev in .env, see .env.example):
  # with SMTP_HOST=mailpit + SMTP_ALLOW_INSECURE=true the API's
  # verification/reset/invitation emails land in the web UI at
  # http://localhost:8025 instead of going through a real relay.
  mailpit:
    # Pinned rather than `latest` (#160), like every image here except
    # postgres and caddy: e2e/scripts/lib/image-pins.ts enforces it.
    image: axllent/mailpit:v1.31.2
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "8025:8025"

  # Pinned rather than `latest` (#160), see mailpit above.
  ollama:
    image: ollama/ollama:0.34.2
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on: [postgres, minio]
    environment:
      DATABASE_URL: postgres://mhome:${POSTGRES_PASSWORD}@postgres/manage_our_home
      # Migrations run here, not on DATABASE_URL's pool — a runtime role set
      # up the way apps/api/README.md prescribes (NOSUPERUSER NOBYPASSRLS)
      # reads every family-scoped table back empty during a migration, so a
      # migration's DML would apply to zero rows and be recorded as applied
      # anyway (issue #105). The API refuses to start if this role doesn't
      # bypass RLS.
      MIGRATION_DATABASE_URL: postgres://migration_role:${MIGRATION_ROLE_PASSWORD}@postgres/manage_our_home
      ADMIN_DATABASE_URL: postgres://admin_role:${ADMIN_ROLE_PASSWORD}@postgres/manage_our_home
      # Behind Caddy the API is publicly reachable under /api (see
      # infra/Caddyfile), so its own public base URL — used for the Google
      # OAuth redirect_uri — must carry that prefix. Emailed links
      # (verify/reset) use FRONTEND_BASE_URL and land on apps/web pages.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}/api
      FRONTEND_BASE_URL: ${PUBLIC_BASE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY}
      MESSAGE_ENCRYPTION_KEY: ${MESSAGE_ENCRYPTION_KEY}
      CALENDAR_FEED_ENCRYPTION_KEY: ${CALENDAR_FEED_ENCRYPTION_KEY}
      # Overridable (SECURE_COOKIES=false in .env) for local http://localhost
      # testing, where Secure cookies can be dropped by the browser.
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      # Whose `X-Forwarded-For` the API believes (#178). Only `caddy` and
      # `web` can reach `api` here — it publishes no port — and Docker's
      # default address pools hand this network a subnet out of
      # 172.16.0.0/12 first, which is the default below. Set it in .env to
      # the network's exact subnet (`docker network inspect`) if that is not
      # where it landed — Docker falls back to 192.168.0.0/16 once the 172
      # pools are used up — or if this host's own LAN overlaps the block.
      # An address in this list is one whose claim about who the client is
      # gets taken at face value, so a range wider than the infrastructure
      # lets whoever is inside it pick an address and dodge (or aim) the
      # login lock; a range that misses the proxies makes every browser one
      # client, and the lock one lock for the whole household. The same
      # collapse happens, with no error, when Caddy's published port goes
      # through docker-proxy and every browser arrives from the gateway —
      # see apps/api/README.md, "When Caddy cannot see the browser's address".
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.0/8,::1/128,172.16.0.0/12}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      # Dev-only knobs (see .env.example). Defaults keep real deployments on
      # the TLS relay path with no seeded accounts.
      SMTP_ALLOW_INSECURE: ${SMTP_ALLOW_INSECURE:-false}
      SMTP_PORT: ${SMTP_PORT:-}
      DEV_SEED_USERS: ${DEV_SEED_USERS:-false}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: manage-our-home

  # apps/web's SSR layer calls apps/api over this internal Docker network
  # (service name `api`, not through Caddy) — see docs/architecture.md's
  # Deployment section and issue #15. The browser only ever talks to
  # apps/web directly, except for the Google OAuth redirect, which is
  # apps/api-hosted and reached through Caddy at /api/auth/google/*.
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_INTERNAL_BASE_URL: http://api:8080
      API_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}/api
      WEB_BIND_ADDR: 0.0.0.0:3000

  # Deliberately left on the major series (#160): Caddy is the
  # Internet-facing frontend (TLS, headers), and picking up its fixes without
  # a manual bump outweighs patch-level reproducibility. Changing series goes
  # through e2e/scripts/lib/image-pins.ts.
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api, web]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  postgres_data:
  minio_data:
  ollama_data:
  caddy_data:
