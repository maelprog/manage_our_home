[package]
name = "manage_our_home_web"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "manage_our_home_web"
path = "src/main.rs"

# Server-rendered only: pages are rendered with Leptos's `view!` macro via
# `leptos::ssr::render_to_string` inside plain axum handlers. There is no
# client-side hydration/WASM bundle — forms are plain HTML `<form method=post>`
# submissions (progressive-enhancement style: works with JS disabled, no
# fetch()/promise rejections to handle client-side per the issue's error
# table). This sidesteps needing a wasm32 toolchain/trunk build step, which
# this environment doesn't have; see the PR description for the tradeoff.
[dependencies]
manage_our_home_shared = { path = "../shared" }
manage_our_home_http_guard = { path = "../http_guard" }
leptos = { version = "0.7", features = ["ssr"] }
# `multipart` on axum: the attachment-upload page reads the browser's
# multipart body before relaying it to apps/api.
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
# The `/assets` route (#67): apps/web served no static file at all before
# the self-hosted fonts landed. `fs` is ServeDir and nothing else — the
# cache header is a `map_response` in src/assets.rs, which sets it on what
# was actually served rather than on 404s too. 0.7, not the 0.6 reqwest
# already pulls in transitively: the dependency policy asks for the newest
# audit-clean version, and the second copy costs build time only (there is
# no way to unify, reqwest 0.12 pins ^0.6).
tower-http = { version = "0.7", features = ["fs"] }
# The stylesheet's content fingerprint (#89): `/assets/style-<digest>.css`
# is derived from the `include_str!`'d constant at startup, so the name, the
# bytes served and the `<link>` in every page come from one source and
# cannot drift apart. SHA-256 rather than a hand-rolled 64-bit hash because
# the digest names a URL that is then promised `immutable` for a year —
# a collision would pin a stale sheet in every cache with no way back — and
# because it costs nothing here: one digest per process start. 0.11 is the
# newest release, and `sqlx-postgres` and `aws-sdk-s3` already resolve to
# exactly that version in apps/api, so the workspace lock gains one line and
# no new crate: nothing new for `cargo audit` to look at.
sha2 = "0.11"
# The stocks' barcode photo (#402): the picture a member takes is decoded
# here, in memory, and never leaves the process — no WebAssembly in the page
# (DESIGN.md), no image sent to apps/api or a third party. `image` reads
# what a phone camera hands a file input, JPEG, plus PNG, and nothing else:
# the default features would add a dozen decoders (AVIF, EXR, TIFF…) and
# rayon. WebP is left out too: its decoder allocates working buffers, up to
# several times the picture, that `image`'s allocation limit does not see
# (`routes::stocks::photo` bounds JPEG's own from its header). rxing is ZXing in Rust; only its 1D readers are compiled in
# (EAN-13, EAN-8, UPC-A live under `oned`), without its own `image`
# feature, which would pull every format back in through `image_formats`,
# nor its client-side parsers (fancy-regex, chrono-tz, uriparse), 2D formats
# or character set tables (`no_character_set_support`: EAN and UPC carry
# digits only). rxing still depends on `regex` itself, which the workspace
# already had: the lock moves it from 1.12.4 to 1.13.1, a minor release.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rxing = { version = "0.9", default-features = false, features = ["oned", "decoders", "no_character_set_support"] }
tower-cookies = "0.10"
cookie = "0.18"
# `multipart` on reqwest: forwarding the uploaded file to apps/api.
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Parses the raw form body for the agenda assignee checkboxes (#73): axum's
# `Form` extractor (this same crate, one layer up) can't deserialize several
# values under one key — what a set of same-named checkboxes submits — so
# that one field is read from the raw body directly. Already resolved
# transitively through axum/reqwest (see Cargo.lock); this just names it.
serde_urlencoded = "0.7"
uuid = { version = "1", features = ["serde"] }
# Calendar date maths (grid) + Europe/Paris display/parse (v1 fixed tz).
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
# `channel`: the upload tests (#219) feed a request body chunk by chunk.
http-body-util = { version = "0.1", features = ["channel"] }
# The stylesheet budget guard (#83) weighs the sheet as the wire carries
# it, not as it sits on disk — DESIGN.md's budget is written in compressed
# bytes because that is what a visitor downloads. A dev-dependency: nothing
# in the shipped binary compresses anything (Caddy's `encode` does that,
# see infra/Caddyfile), so this must not reach the release graph.
flate2 = "1"
# The barcode photo's memory tests (#402) need progressive and CMYK JPEGs,
# which `image`'s own encoder does not write.
jpeg-encoder = "0.7"
