# Staging: the home server, 4 GB of RAM for the whole cluster (arbitrage
# of 2026-10-12). Follows `main`; Argo CD syncs it automatically (#432).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# The ingress's host, its rules and certificate: FRONTEND_BASE_URL's below.
components:
  - ../../base/ingress/host

# By digest, never by tag: a tag can be moved, a digest cannot, and the
# Kyverno policy of #432 refuses anything else. Images published by
# .github/workflows/images.yml on main (#430), the source of the pair
# after each digest (the first: run 38333383259). Moved by
# ci/set-images.sh, in a PR (README, « Promotion », #436).
images:
  - name: ghcr.io/maelprog/manage-our-home-api
    digest: sha256:6aa7f45c421a9e726378ffd45a8a84289d8a5c6bdcfce1db33355d561408aa0c # main aef6388
  - name: ghcr.io/maelprog/manage-our-home-web
    digest: sha256:1974b44f0ab005f260fe885b2d585b2d4e73031101630f6b75ec000151e8c0e6 # main aef6388

# One replica each: the cluster has a budget of about 3 GB for the
# platform, Postgres, MinIO, api and web together. The
# PodDisruptionBudgets of the base (maxUnavailable: 1) let a drain
# through at one replica.
replicas:
  - name: api
    count: 1
  - name: web
    count: 1

# Spread by node as a preference only: with one node, or one node short
# during a drain, DoNotSchedule would leave a pod Pending rather than put
# it next to another.
patches:
  - target:
      kind: Deployment
      name: (api|web)
    patch: |-
      - op: replace
        path: /spec/template/spec/topologySpreadConstraints/0/whenUnsatisfiable
        value: ScheduleAnyway
  # A public name, but no port of the home server open to the Internet:
  # Let's Encrypt validates by DNS-01, a TXT record Scaleway's webhook
  # writes into the `watallo.fr` zone (platform/components/cert-manager-dns01,
  # #682), rather than by HTTP-01 on port 80 (#683).
  - target:
      kind: Certificate
      name: manage-our-home-tls
    patch: |-
      - op: replace
        path: /spec/issuerRef/name
        value: letsencrypt-dns01

configMapGenerator:
  - name: api-config
    behavior: merge
    literals:
      # The staging server's name in the public `watallo.fr` zone, whose A
      # record names the server's Tailscale address: reached through the
      # tailnet only (docs/install-k3s.md, "Le nom du staging", #683,
      # #684). The ingress (#434) serves the host of FRONTEND_BASE_URL,
      # with a Let's Encrypt certificate; the other two name the same host
      # (ci/render-test.sh).
      - PUBLIC_BASE_URL=https://staging.watallo.fr/api
      - FRONTEND_BASE_URL=https://staging.watallo.fr
      # Placeholders until a relay is chosen: `.invalid` resolves nowhere
      # (RFC 2606), so no mail leaves for a third party.
      - SMTP_HOST=smtp.manage-our-home.invalid
      - SMTP_FROM=no-reply@staging.manage-our-home.invalid
      - VAPID_SUBJECT=mailto:admin@staging.manage-our-home.invalid
  - name: web-config
    behavior: merge
    literals:
      - API_PUBLIC_BASE_URL=https://staging.watallo.fr/api
