# The TLS certificate of the host (#434), from Let's Encrypt through
# cert-manager and the ClusterIssuers of
# platform/components/cert-manager/cluster-issuers.yaml; the IngressRoute
# reads the Secret it fills. Until it is issued, Traefik answers with its
# own self-signed default certificate.
#
# `letsencrypt` is production's: browsers do not trust
# `letsencrypt-staging`'s certificates, and that issuer stays to try an
# issuance out by hand, under its generous rate limits. The staging
# overlay names `letsencrypt-dns01` instead
# (platform/components/cert-manager-dns01): the test server opens no port
# to the Internet, so its challenge is a DNS record, not a request on
# port 80 (#683).
#
# The host is the overlay's (base/ingress/host): `ingress-host.invalid`
# below is replaced.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: manage-our-home-tls
spec:
  secretName: manage-our-home-tls
  dnsNames:
    - ingress-host.invalid
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
