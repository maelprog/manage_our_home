# Pod Security Admission at `restricted`: the API server itself refuses a
# pod of this namespace that runs as root, keeps a capability, or allows
# privilege escalation — whatever a later patch to these manifests says.
apiVersion: v1
kind: Namespace
metadata:
  name: manage-our-home
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
