# Creates the bucket api expects (MINIO_BUCKET of api-config): MinIO
# creates none by itself, and neither does api's S3 client. The `minio-init`
# service of infra/docker-compose.yml on main, as a Job.
#
# An Argo CD Sync hook, between MinIO (wave -2) and api and web (0): it
# runs on every sync, so it must change nothing when the bucket is there —
# it says so and exits 0. It never deletes nor empties anything.
#
# Same image as Compose's `minio-init`, same tag and digest: mc has its own
# release clock, hence not the server's version.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket
  labels:
    app.kubernetes.io/name: minio-bucket
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    # As the migration Job: the previous run is deleted when the next one
    # is created, its logs readable until then.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-bucket
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bucket
          image: docker.io/bitnamilegacy/minio-client:2025.7.21-debian-12-r3@sha256:73bd39f7899a0cef12b8dd5df13aa93a3ed1aaa44236542442e9ac76819ac158
          # Bitnami's entrypoint replaced, as in Compose. `mc mb
          # --ignore-existing` says "Bucket created successfully" for a
          # bucket that was already there: the bucket is looked for first,
          # so that a run that creates nothing says so. Created without
          # --ignore-existing: a bucket that `mc stat` missed for another
          # reason fails the run rather than passing for created.
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" > /dev/null; do
                sleep 2
              done
              if mc stat "local/$MINIO_BUCKET" > /dev/null 2>&1; then
                echo "bucket $MINIO_BUCKET: already there, nothing to do"
              else
                mc mb "local/$MINIO_BUCKET"
              fi
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: {name: minio, key: MINIO_ROOT_USER}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: minio, key: MINIO_ROOT_PASSWORD}
            # The name api uses (MINIO_BUCKET of api-config), restated:
            # api-config is applied in wave 0, after this hook, so it may
            # not exist yet. ci/render-test.sh checks the two are equal.
            - name: MINIO_BUCKET
              value: manage-our-home
            # mc keeps its aliases in a config directory: on /tmp, the
            # root filesystem being read-only.
            - name: MC_CONFIG_DIR
              value: /tmp/mc
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Bounded too (arbitrage of 2026-10-12). Too short-lived for
          # `kubectl top`; ran within this limit in the k3d job.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
