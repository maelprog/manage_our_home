# The api image's `migrate` command (#425): applies the pending migrations
# as the migration role, then exits. An Argo CD PreSync hook: it runs, and
# must succeed, before Argo CD applies anything else of the sync — the new
# api pods start on a schema that is already theirs. A failed Job stops
# the sync; the running pods are left as they were.
#
# Same image as api.yaml: the overlays' `images:` pins both at once.
#
# On the first sync of an environment, the namespace (with its Pod
# Security labels) and the Secret `migrate-secrets` must both exist before
# this hook runs: the platform's root Application applies both, in earlier
# sync waves, before this Application (#432, platform/clusters/<env>).
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels:
    app.kubernetes.io/name: migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    # The previous run is deleted when the next one is created, not when
    # it succeeds: its logs stay readable until the next sync.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # Retries cover a Postgres that is not reachable yet. Concurrent runs are
  # serialised by sqlx's advisory lock, and a run is a no-op on an
  # up-to-date schema. A role refused for good fails the Job: 4 pods of
  # about 2 minutes each (see the command), plus the backoff between them,
  # or the deadline first.
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/maelprog/manage-our-home-api
          # `migrate`, retried in the same pod while it cannot connect as
          # the migration role (#520): on an environment's first sync, this
          # hook can start before CloudNativePG has set that role's
          # password (managed roles, postgres/cluster.yaml), and its first
          # pod used to end in Error. Only that failure is retried —
          # `connecting as the migration role` is the context main's
          # `migrations::apply` gives it, before anything is applied. New
          # attempts start for 90 s; the last one runs until migrate gives
          # up connecting (its pool's 30 s acquire timeout, at most), so a
          # password that stays wrong fails the pod within about 2 minutes,
          # then the Job (backoffLimit). Any other failure fails the pod at
          # once, with migrate's exit code.
          #
          # migrate's log (stdout) reaches the pod's as it goes; its error
          # (stderr), kept in /tmp to be read, right after it exits. The
          # shell is PID 1, which ignores a signal it has no handler for:
          # the trap passes the kubelet's SIGTERM on to migrate.
          command:
            - /bin/sh
            - -c
            - |
              err=${TMPDIR:-/tmp}/migrate.err
              trap 'stop=1; kill -TERM "$pid" 2> /dev/null' TERM INT
              deadline=$(($(date +%s) + 90))
              while :; do
                migrate 2> "$err" &
                pid=$!
                wait "$pid"
                rc=$?
                # A trapped signal ends `wait` early: wait for migrate's own exit.
                while kill -0 "$pid" 2> /dev/null; do
                  wait "$pid"
                  rc=$?
                done
                cat "$err" >&2
                [ "$rc" -eq 0 ] && exit 0
                [ -z "${stop:-}" ] || exit "$rc"
                grep -q 'connecting as the migration role' "$err" || exit "$rc"
                [ "$(date +%s)" -lt "$deadline" ] || exit "$rc"
                echo "migrate: the migration role is not accepted yet, retrying in 5 s"
                sleep 5 &
                pid=$!
                wait "$pid"
                [ -z "${stop:-}" ] || exit 143
              done
          env:
            # The migration role: owner of the tables, BYPASSRLS (#105).
            # Only this Job receives it.
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: migrate-secrets, key: MIGRATION_DATABASE_URL}
          securityContext:
            allowPrivilegeEscalation: false
            # The migrations are compiled into the binary; nothing is
            # written but to Postgres, and migrate's error to /tmp.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Too short-lived for `kubectl top` to sample; the 29 migrations
          # of main applied on an empty base within this limit, without
          # an OOM kill (k3d job).
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # migrate's error, a few lines, read back by the shell above.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
