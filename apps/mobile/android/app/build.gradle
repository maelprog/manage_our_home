import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// What the shell takes from elsewhere in the repository (#665), read once
// when Gradle configures the project:
// - the synced Capacitor config (assets/capacitor.config.json, written by
//   `npx cap sync` from ../capacitor.config.ts): the app's name, and the
//   site the WebView opens, which each flavour checks below;
// - apps/web/src/brand.rs: the two colours of the web manifest;
// - apps/web/src/brand/: the icons of the web manifest (copyBrandIcons).
def syncedConfigFile = file('src/main/assets/capacitor.config.json')
if (!syncedConfigFile.exists()) {
    throw new GradleException("${syncedConfigFile} is missing: run `npx cap sync android` in apps/mobile first")
}
def syncedConfig = new JsonSlurper().parse(syncedConfigFile)
def stagingUrl = 'https://staging.watallo.fr'

// A signed release (#666, .github/workflows/mobile-release.yml): its
// version comes from the tag, through -PmhomeVersionName and
// -PmhomeVersionCode (scripts/release-version.mjs); its key from two
// environment variables, never from a file of the repository. A debug
// build needs none of them, and keeps version 1 / "1.0".
def releaseVersionName = findProperty('mhomeVersionName') as String
def releaseVersionCode = findProperty('mhomeVersionCode') as String
// Android takes a versionCode from 1 to 2 100 000 000.
def releaseVersionCodeOk = releaseVersionCode ==~ /[1-9][0-9]{0,9}/ && releaseVersionCode.toLong() <= 2_100_000_000L
def keystorePath = System.getenv('MHOME_KEYSTORE_FILE')
def keystorePassword = System.getenv('MHOME_KEYSTORE_PASSWORD')
// The alias the README's keytool command gives the key. A PKCS12 keystore
// (keytool's default) has one password, for the store and the key alike.
def keyAliasName = 'mhome'
def signingReady = keystorePath && keystorePassword && file(keystorePath).isFile()

def brandDir = file('../../../web/src/brand')
def brandSource = file('../../../web/src/brand.rs').getText('UTF-8')
def brandColour = { String name ->
    def found = brandSource =~ /(?m)^pub const ${name}: &str = "(#[0-9A-Fa-f]{6})";$/
    if (!found.find()) {
        throw new GradleException("apps/web/src/brand.rs: no `pub const ${name}: &str = \"#RRGGBB\";` line")
    }
    found.group(1)
}

android {
    namespace = "fr.watallo.mhome"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "fr.watallo.mhome"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode releaseVersionCodeOk ? releaseVersionCode.toInteger() : 1
        versionName releaseVersionName ?: "1.0"
        resValue "string", "app_name", syncedConfig.appName
        resValue "color", "brand_theme", brandColour('THEME_COLOR')
        resValue "color", "brand_background", brandColour('BACKGROUND_COLOR')
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        resValues = true
    }
    // Which site the APK opens by default is chosen at `npx cap sync`
    // (MHOME_TARGET, capacitor.config.ts); the flavour names it, so the two
    // can be checked against each other (checkSyncedTarget below). A site
    // stored on the phone replaces it at launch (MainActivity). The staging
    // flavour has an id of its own, so one phone can hold both apps.
    flavorDimensions = ["target"]
    productFlavors {
        staging {
            dimension "target"
            applicationIdSuffix ".staging"
        }
        prod {
            dimension "target"
        }
    }
    sourceSets {
        main {
            res.srcDirs += layout.buildDirectory.dir('generated/brand-res').get().asFile
        }
    }
    signingConfigs {
        if (signingReady) {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasName
                keyPassword keystorePassword
            }
        }
    }
    buildTypes {
        release {
            if (signingReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// The icons of the web manifest, under the names Android looks for. One
// density each, the largest: Android scales a bitmap down for the others.
// The legacy icon (Android 7) is the rounded tile; from Android 8 the
// launcher icon is adaptive, out of the maskable one
// (res/mipmap-anydpi-v26/ic_launcher.xml).
def copyBrandIcons = tasks.register('copyBrandIcons', Copy) {
    into layout.buildDirectory.dir('generated/brand-res')
    from(brandDir) {
        include 'icon-maskable-512.png'
        rename { 'brand_maskable.png' }
        into 'drawable-nodpi'
    }
    from(brandDir) {
        include 'icon-192.png'
        rename { 'ic_launcher.png' }
        into 'mipmap-xxxhdpi'
    }
    from(brandDir) {
        include 'icon-192.png'
        rename { 'ic_launcher_round.png' }
        into 'mipmap-xxxhdpi'
    }
}
preBuild.dependsOn copyBrandIcons

// A staging APK opens by default the staging server and nothing else; a
// prod APK, an https site that is not the staging server. A sync for the
// other target fails the build here instead of shipping in silence.
def syncedUrl = syncedConfig.server?.url as String
def checkSyncedTarget = { String flavor ->
    def ok = flavor == 'staging'
        ? syncedUrl == stagingUrl
        : (syncedUrl != null && syncedUrl.startsWith('https://') && syncedUrl != stagingUrl)
    if (!ok) {
        throw new GradleException(
            "the synced capacitor.config.json opens ${syncedUrl}, not a ${flavor} site: " +
            (flavor == 'staging'
                ? "run `npx cap sync android` (MHOME_TARGET unset or staging)"
                : "run `MHOME_TARGET=prod MHOME_PROD_URL=https://… npx cap sync android`"))
    }
}
// A release is what families install: the prod flavour only, signed with
// the release key, and numbered from its tag. Without one of them the
// build stops here, saying which, rather than produce an unsigned APK, a
// staging one (it opens the test server, reachable by the VPN only), or a
// versionCode 1 that no update could follow.
def checkRelease = { String flavor ->
    def problems = []
    if (flavor != 'prod') {
        problems << "the ${flavor} flavour has no release build: release the prod flavour (assembleProdRelease)"
    }
    if (!keystorePath) {
        problems << 'MHOME_KEYSTORE_FILE is not set: the path of the release keystore (apps/mobile/README.md, signed APK)'
    } else if (!file(keystorePath).isFile()) {
        problems << "MHOME_KEYSTORE_FILE=${keystorePath}: no such file"
    }
    if (!keystorePassword) {
        problems << 'MHOME_KEYSTORE_PASSWORD is not set: the password of the release keystore'
    }
    if (!releaseVersionName || !releaseVersionCode) {
        problems << '-PmhomeVersionName and -PmhomeVersionCode are required: run `node scripts/release-version.mjs mobile-vX.Y.Z` in apps/mobile'
    } else if (!releaseVersionCodeOk) {
        problems << "-PmhomeVersionCode=${releaseVersionCode}: expected an integer from 1 to 2100000000"
    }
    if (problems) {
        throw new GradleException("cannot build a release APK:\n- " + problems.join('\n- '))
    }
}
android.applicationVariants.all { variant ->
    def flavor = variant.flavorName
    def buildType = variant.buildType.name
    def check = tasks.register("check${flavor.capitalize()}${buildType.capitalize()}SyncedTarget") {
        doLast { checkSyncedTarget(flavor) }
    }
    variant.preBuildProvider.configure { dependsOn check }
    if (buildType == 'release') {
        def releaseCheck = tasks.register("check${flavor.capitalize()}Release") {
            doLast { checkRelease(flavor) }
        }
        variant.preBuildProvider.configure { dependsOn releaseCheck }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
