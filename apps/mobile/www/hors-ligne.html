<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MHome — hors ligne</title>
<!--
  The page the app shows when the site cannot be loaded (#665): no network,
  or no answer from the server. Capacitor serves it out of the APK
  (`server.errorPath` of capacitor.config.ts), at the site's own origin, as
  the one file at that address it does not fetch. Everything it uses is in
  this file: a stylesheet or a font at another path would be fetched from
  the network, which is what is missing. So the fonts are the fallbacks of
  apps/web/src/style.css (Georgia for Fraunces, the system sans for Source
  Sans 3), and the tokens are DESIGN.md's, light and dark, without
  apps/web's choice of theme, which lives in a cookie of the site.
  No Content-Security-Policy reaches this page (it does not come from
  Caddy), which is why its one script can be inline: in a file of its own
  it would be fetched from the network too.
-->
<style>
:root {
  --bg: #FBFAF7; --surface: #FFFFFF; --fg: #1C1A17; --muted: #6B655C;
  --accent: #14706E; --accent-fg: #FFFFFF; --accent-hover: #105855;
  --shadow: 0 1px 2px rgba(28,26,23,.06), 0 8px 24px rgba(28,26,23,.06);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1A1917; --surface: #242320; --fg: #EDEAE4; --muted: #A19A8F;
    --accent: #4FB3AF; --accent-fg: #10201F; --accent-hover: #6EC7C3;
    --shadow: 0 0 0 1px #2E2C28, 0 8px 24px rgba(0,0,0,.28);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center;
  padding: 16px; background: var(--bg); color: var(--fg);
  font-family: ui-sans-serif, system-ui, sans-serif; font-size: 1rem;
}
main {
  max-width: 28rem; width: 100%; padding: 24px; border-radius: 16px;
  background: var(--surface); box-shadow: var(--shadow);
}
h1 {
  margin: 0 0 12px; font-family: Georgia, serif; font-weight: 600;
  font-size: 1.75rem; line-height: 1.25; letter-spacing: -0.01em;
}
p { margin: 0 0 16px; }
.muted { color: var(--muted); }
button {
  min-height: 48px; min-width: 48px; padding: 12px 24px; border: 0;
  border-radius: 12px; background: var(--accent); color: var(--accent-fg);
  font: inherit; font-weight: 600; cursor: pointer;
}
button:hover, button:focus-visible { background: var(--accent-hover); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
<h1>Pas de connexion</h1>
<p>MHome n'a pas pu joindre le serveur. Vérifiez que le téléphone est
connecté à Internet, puis réessayez.</p>
<button type="button" id="retry">Réessayer</button>
</main>
<script>
// Back to the site's home page, at this same origin: if the network is
// still missing, the app comes back here.
document.getElementById("retry").addEventListener("click", function () {
  location.replace("/");
});
</script>
</body>
</html>
