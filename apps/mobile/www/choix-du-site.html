<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MHome — choix du site</title>
<!--
  The page the app shows at its first launch (#737), before any site is
  chosen, and when the site is changed afterwards (#738): the flavour's
  standard site, or one of the member's own; on a change, the current one
  can be kept. Served out of the APK by Capacitor's local server, at
  https://localhost (MainActivity, which sets that up only for this page),
  with its scripts beside it; nothing is fetched from the network but the
  probe of a typed address, which MainActivity's Site plugin makes.
  The tokens are DESIGN.md's, light and dark, as in hors-ligne.html
  (check-shell.test.mjs keeps the two pages' tokens the same and checks
  their contrasts), and the fonts its fallbacks: none is in the APK.
-->
<style>
:root {
  --bg: #FBFAF7; --surface: #FFFFFF; --fg: #1C1A17; --muted: #6B655C;
  --accent: #14706E; --accent-fg: #FFFFFF; --accent-hover: #105855;
  --shadow: 0 1px 2px rgba(28,26,23,.06), 0 8px 24px rgba(28,26,23,.06);
  --border: #E3DFD7; --hover: #F2EFE9; --accent-soft: #E1F0EF;
  --error: #A8342A; --error-soft: #F7E5E2;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1A1917; --surface: #242320; --fg: #EDEAE4; --muted: #A19A8F;
    --accent: #4FB3AF; --accent-fg: #10201F; --accent-hover: #6EC7C3;
    --shadow: 0 0 0 1px #2E2C28, 0 8px 24px rgba(0,0,0,.28);
    --border: #38352F; --hover: #2E2C28; --accent-soft: #1C3635;
    --error: #E88075; --error-soft: #3A211E;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center;
  padding: 16px; background: var(--bg); color: var(--fg);
  font-family: ui-sans-serif, system-ui, sans-serif; font-size: 1rem;
}
main {
  max-width: 28rem; width: 100%; padding: 24px; border-radius: 20px;
  background: var(--surface); box-shadow: var(--shadow);
}
h1, h2 {
  font-family: Georgia, serif; font-weight: 600; line-height: 1.25;
  letter-spacing: -0.01em;
}
h1 { margin: 0 0 12px; font-size: 1.75rem; }
h2 { margin: 0 0 8px; font-size: 1.375rem; }
p { margin: 0 0 16px; }
section + section { margin-top: 32px; }
.muted { color: var(--muted); }
label { display: block; margin-bottom: 4px; font-size: 0.9375rem; font-weight: 600; }
input {
  display: block; width: 100%; margin-bottom: 16px; padding: 12px;
  border: 1px solid var(--border); border-radius: 12px;
  background: var(--surface); color: var(--fg); font: inherit;
}
input:focus-visible {
  outline: 2px solid transparent; border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
input[aria-invalid="true"] { border-color: var(--error); }
button {
  min-height: 48px; min-width: 48px; width: 100%; padding: 12px 24px;
  border: 1px solid var(--accent); border-radius: 12px;
  background: var(--accent); color: var(--accent-fg);
  font: inherit; font-weight: 600; cursor: pointer;
}
button:hover, button:focus-visible { background: var(--accent-hover); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.secondary { background: var(--surface); border-color: var(--border); color: var(--fg); }
button.secondary:hover, button.secondary:focus-visible { background: var(--hover); }
button:disabled { cursor: progress; }
/* Empty, it takes no room; filled, the notice of DESIGN.md's .notice.error. */
.error:not(:empty) {
  margin: 0 0 16px; padding: 12px; border: 1px solid currentColor;
  border-radius: 16px; background: var(--error-soft); color: var(--error);
}
.status:empty { display: none; }
.status { margin: 16px 0 0; }
</style>
</head>
<body>
<main>
<h1>Quel site ouvrir ?</h1>
<p class="muted" id="intro">MHome affiche le site de votre foyer. Choisissez-le une fois :
l'application l'ouvrira ensuite directement.</p>

<!-- Shown when the site is changed afterwards (#738), not at the first launch. -->
<section aria-labelledby="current-title" id="current" hidden>
<h2 id="current-title">Site actuel</h2>
<p class="muted" id="current-host"></p>
<button type="button" id="keep" aria-describedby="current-host">Garder ce site</button>
</section>

<section aria-labelledby="standard-title">
<h2 id="standard-title">Site standard</h2>
<p class="muted" id="standard-host">Le site prévu par cette version de l'application.</p>
<button type="button" id="standard" aria-describedby="standard-host">Ouvrir le site standard</button>
</section>

<section aria-labelledby="custom-title">
<h2 id="custom-title">Site personnalisé</h2>
<form id="custom" novalidate>
<label for="address">Adresse du site</label>
<p class="muted" id="address-hint">Celle que vous tapez dans le navigateur, par exemple maison.exemple.fr.</p>
<!-- Above the field, not under it: the keyboard, still open, would hide it. -->
<p id="address-error" class="error" role="alert"></p>
<input id="address" name="address" type="text" inputmode="url" autocomplete="url"
  autocapitalize="none" spellcheck="false" enterkeyhint="go"
  aria-describedby="address-hint address-error">
<button type="submit" class="secondary" id="continue">Continuer</button>
</form>
</section>

<p id="status" class="status muted" role="status"></p>
</main>
<script type="module" src="choix-du-site.js"></script>
</body>
</html>
