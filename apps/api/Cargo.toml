[package]
name = "manage_our_home"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "manage_our_home"
path = "src/main.rs"

# Ops script, not part of the server (#58): finds attachment objects in
# MinIO that no `event_attachments` row points at and, with --apply,
# deletes them.
[[bin]]
name = "reconcile-attachments"
path = "src/bin/reconcile_attachments.rs"

# Applies the migrations and exits (#425): the server only checks that the
# schema is current, so the migration role's credentials stay off it.
[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[lib]
name = "manage_our_home"
path = "src/lib.rs"

[dependencies]
manage_our_home_shared = { path = "../shared" }
manage_our_home_http_guard = { path = "../http_guard" }
axum = { version = "0.7", features = ["macros", "multipart", "ws"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
rand = "0.8"
oauth2 = { version = "5", default-features = false, features = ["reqwest"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tower = "0.4"
tower-cookies = "0.10"
cookie = "0.18"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1"
anyhow = "1"
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder"] }
dotenvy = "0.15"
rrule = "0.14.0"
# No `sigv4a` (#591): the SDK signs with SigV4a only for S3 Multi-Region
# Access Points, an AWS-only resource this app never addresses (it talks to
# one bucket on an S3-compatible endpoint). The feature pulled `crypto-bigint` 0.5 through `aws-sigv4`, still
# on that line in its newest release, and 0.5 has no fix for
# RUSTSEC-2026-0387.
aws-sdk-s3 = { version = "1.137.0", default-features = false, features = ["http-1x", "default-https-client", "rt-tokio"] }
aws-config = "1.8.18"
aws-credential-types = "1.2.14"
infer = "0.19.0"
# CIDR containment for the trusted-proxy list `src/client_ip.rs` matches the
# request's peer against (#178). Hand-rolled prefix maths would be a dozen
# lines, but they would be a dozen lines of security-relevant bit twiddling
# on the path that decides whether an attacker-supplied header is believed.
# No dependencies of its own, and already in Cargo.lock at this exact
# version (`hyper-util`, under axum and reqwest, pulls it in), so naming it
# here adds one line to the manifest and no crate to the audit surface.
ipnet = "2.12.0"
bytes = "1.12.0"
futures = "0.3.32"
icalendar = { version = "0.17.12", default-features = false, features = ["chrono-tz", "parser"] }
# VAPID (RFC 8292) for the reminders sent as a notification (#306): each
# push carries an ES256 token signed with the server's P-256 key. Pushes
# carry no payload, so no message encryption (RFC 8291) is needed — only
# this signature. The newest release (dependency policy). `ecdsa` and
# `std` only: no PEM, no PKCS#8.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
# The token's parts and the public key are unpadded base64url. The newest
# release, next to the 0.22 that axum, reqwest and the others still pull.
base64 = "0.23"
# SHA-256 of the session token (#222): the table keeps the hash, the cookie
# the token. The newest release, next to the 0.10 other crates still pull.
sha2 = "0.11"
# The login lock's pseudonyms (#427): HMAC-SHA256 of the client address
# and of the (address, email) pair, so `login_throttle` holds neither. The
# newest release, the one aws-sigv4 already pulls next to sha2 0.11.
hmac = "0.13"
# Decompresses the embedded Open Food Facts category taxonomy (#406,
# `recipes::taxonomy`): 205 KB gzipped instead of 932 KB in the binary.
# The newest release (dependency policy), shared with apps/web.
flate2 = "1.1.10"
# JPEG and PNG only: the avatar refuses WebP (#588), the one user here.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# The avatar's JPEG decode (#588): `Decoder::scale` reduces a picture in
# the inverse DCT (1/2, 1/4, 1/8), which `image`'s zune-jpeg cannot, so a
# 50 Mpx photo never exists at full size in memory. Without `rayon`: no
# pool shared with the process — the decoder still starts a thread per
# colour component of its own (`worker/multithreaded.rs`) once the reduced
# frame is over 128 pixels wide (it squares the width, not width × height).
jpeg-decoder = { version = "0.3.2", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
serial_test = "3"
hyper = { version = "1", features = ["full"] }
http-body-util = "0.1"
tower = { version = "0.4", features = ["util"] }
tokio-tungstenite = "0.21"
# Progressive and CMYK JPEG fixtures for the avatar's decode (#588), which
# `image`'s encoder does not write. The release `image` already pulls.
jpeg-encoder = "0.7.1"
