<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Clafoutis aux cerises - Le blog</title>
</head>
<body>
<!-- Constructed (#475): the microdata markup recipe plugins emit, no real page. -->
<header><h1>Le blog de cuisine</h1></header>
<article itemscope itemtype="https://schema.org/Recipe">
  <h2 itemprop="name">Clafoutis aux cerises</h2>
  <div itemprop="author" itemscope itemtype="https://schema.org/Person">
    <span itemprop="name">Jeanne</span>
  </div>
  <meta itemprop="recipeYield" content="6">
  <h3>Ingrédients</h3>
  <ul>
    <li itemprop="recipeIngredient">500 g de cerises</li>
    <li itemprop="recipeIngredient">3 <b>oeufs</b></li>
    <li itemprop="recipeIngredient">100 g de sucre</li>
    <li itemprop="ingredients">25 cl de lait</li>
  </ul>
  <h3>Préparation</h3>
  <ol itemprop="recipeInstructions">
    <li>Préchauffer le four à 180&nbsp;°C.</li>
    <li>Battre les oeufs avec le sucre, puis ajouter le lait.</li>
  </ol>
  <div itemprop="recipeInstructions" itemscope itemtype="https://schema.org/HowToStep">
    <p itemprop="text">Verser sur les cerises et cuire 35 minutes.</p>
  </div>
</article>
</body>
</html>
