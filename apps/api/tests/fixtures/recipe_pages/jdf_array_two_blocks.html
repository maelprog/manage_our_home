  "name": "Crêpes : la meilleure recette rapide",
  "recipeYield": "4 personnes",
  "recipeIngredient": [
   "250 g farine",
   "4 oeuf",
   "½ litre lait",
   "1 pincée sel",
   "2 c à s sucre",
   "50 g beurre fondu"
  ],
  "recipeInstructions": [
   {
    "@type": "HowToStep",
    "text": "Mettez la farine dans un saladier avec le sel et le sucre. "
   },

    "@type": "HowToStep",
    "text": "Faites un puits au milieu et versez-y les œufs."
   },
   {
    "@type": "HowToStep",
    "text": "Commencez à mélanger doucement. Quand le mélange devient épais, ajoutez le lait froid petit à petit. "
   },
   {
    "@type": "HowToStep",
    "text": "Quand tout le lait est mélangé, la pâte doit être assez fluide. Si elle vous paraît trop épaisse, rajoutez un peu de lait. Ajoutez ensuite le beurre fondu refroidi, mélangez bien."
   },
   {
    "@type": "HowToStep",

   },
   {
    "@type": "HowToStep",
    "text": "Laissez cuire environ une minute de ce côté et la crêpe est prête."
   },
   {
    "@type": "HowToStep",
