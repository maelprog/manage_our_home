[package]
name = "manage_our_home_shared"
version = "0.1.0"
edition = "2021"

[lib]
name = "manage_our_home_shared"
path = "src/lib.rs"

# No sqlx/axum deps: this crate must compile natively (apps/api, apps/web's
# SSR side) and to wasm32-unknown-unknown (apps/web's client-side hydration).
[dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde"] }
# Agenda DTOs carry `DateTime<Utc>`/`NaiveDate`; the calendar-grid maths in
# `validation/agenda.rs` use chrono's civil-date types. `default-features`
# off (drops the `clock`/`now()` path) keeps this wasm-clean — nothing here
# reads the wall clock.
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
# Messagerie timestamps are rendered in Europe/Paris (the fixed v1 display
# timezone F3 established): `validation::messagerie::format_message_time`
# converts the UTC instant itself, so the DST logic is unit-tested here rather
# than duplicated per page. Tz data only — no clock access, wasm-clean.
chrono-tz = "0.10"
