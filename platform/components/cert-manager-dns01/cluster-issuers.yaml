# Let's Encrypt by DNS-01 (#682), on the model of the HTTP-01 pair of
# platform/components/cert-manager/cluster-issuers.yaml: the challenge is a
# TXT record in the Scaleway zone, written and deleted by Scaleway's
# webhook (application.yaml, next to this file), so a certificate needs no
# port open to the Internet. `letsencrypt-dns01-staging` issues untrusted
# certificates under generous rate limits, for trials;
# `letsencrypt-dns01` issues the real ones.
#
# The webhook's key is the sealed `scaleway-dns01`
# (platform/clusters/<env>/cert-manager-secrets), an IAM application of
# its own limited to the DNS (platform/README.md, « DNS-01 chez
# Scaleway »), never the backup bucket's. A ClusterIssuer reads its
# Secrets in cert-manager's namespace.
#
# No contact address, as for the HTTP-01 pair.
#
# After cert-manager's Application (wave -10), whose CRDs they need.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns01-staging
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-dns01-staging-account
    solvers:
      - dns01:
          webhook:
            groupName: acme.scaleway.com
            solverName: scaleway
            config:
              accessKeySecretRef:
                name: scaleway-dns01
                key: SCW_ACCESS_KEY
              secretKeySecretRef:
                name: scaleway-dns01
                key: SCW_SECRET_KEY
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns01
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-dns01-account
    solvers:
      - dns01:
          webhook:
            groupName: acme.scaleway.com
            solverName: scaleway
            config:
              accessKeySecretRef:
                name: scaleway-dns01
                key: SCW_ACCESS_KEY
              secretKeySecretRef:
                name: scaleway-dns01
                key: SCW_SECRET_KEY
