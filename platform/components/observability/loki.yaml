# Loki (#437): the logs of every pod of the cluster, collected by Alloy
# (alloy.yaml, next to this file), queried from Grafana.
#
# One process (`Monolithic`), its chunks and index on a volume of the
# node: no object store, no cache, no gateway, no canary. Nothing reaches
# it from outside the cluster: a ClusterIP Service, and Loki has no
# Ingress.
#
# Retention: 14 days (`retention_period: 336h`), applied by the compactor,
# which deletes what is older at its next pass (every 10 minutes, after
# `retention_delete_delay`, 2 hours). The logs can hold IP addresses:
# this duration is the one main's docs/registre-traitements.md declares
# ("Journaux techniques"); change both together. ci/platform-test.sh
# checks the rendered configuration.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: 18.16.1
    helm:
      releaseName: loki
      valuesObject:
        deploymentMode: Monolithic
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2026-10-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h
          limits_config:
            retention_period: 336h
          compactor:
            retention_enabled: true
            retention_delete_delay: 2h
            delete_request_store: filesystem
          # No usage report sent to Grafana Labs.
          analytics:
            reporting_enabled: false
        singleBinary:
          replicas: 1
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {memory: 512Mi}
          persistence:
            size: 10Gi
          # The rules sidecar: no Loki alerting rules here.
          sidecar: false
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        gateway:
          enabled: false
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        lokiCanary:
          enabled: false
        test:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
