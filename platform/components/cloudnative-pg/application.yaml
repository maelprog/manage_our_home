# The CloudNativePG operator (#432). The Postgres clusters it runs are
# #433's.
#
# Operator 1.30.1. Its 1.31.0 removes the native barman-cloud backups
# that apps/manage-our-home/base/postgres/cluster.yaml uses: moving to it
# needs the backups migrated to the Barman Cloud plugin first (README.md,
# "Sauvegardes").
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.1
    helm:
      releaseName: cnpg
      valuesObject:
        replicaCount: 1
        # By tag and digest (#435): the chart writes `repository:tag` both
        # into the operator's image and into OPERATOR_IMAGE_NAME, the image
        # the operator puts in each Postgres pod as its bootstrap-controller,
        # which the closed list of components/kyverno/allowed-images.yaml
        # names exactly. Digest of the multi-architecture index of 1.30.1.
        image:
          tag: "1.30.1@sha256:923c267ec29636db3bee20f993d0ec4973fa22998e1adad37da79e4d32b5bc07"
        resources:
          requests: {cpu: 25m, memory: 64Mi}
          limits: {memory: 256Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs are too large for the last-applied annotation of a
      # client-side apply.
      - ServerSideApply=true
