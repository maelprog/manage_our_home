# Production's Postgres (#433): the CloudNativePG Cluster of
# apps/manage-our-home/overlays/prod/postgres, one sync wave before the
# application (see platform/clusters/staging/postgres.yaml). No
# `syncPolicy.automated`, like the application (arbitrage of 2026-10-10):
# a merge on `deploy` that changes the database leaves it OutOfSync until
# the user presses Sync. ci/platform-test.sh fails if one appears.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://github.com/maelprog/manage_our_home.git
    targetRevision: deploy
    path: apps/manage-our-home/overlays/prod/postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: manage-our-home
