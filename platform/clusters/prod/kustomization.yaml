# What runs on the production cluster (#432), the third-party VPS:
# rendered by the root Application `platform` (root.yaml), which
# platform/bootstrap.sh applies. The choice of bricks per cluster is the
# list of components below: the observability of #437 runs here only.
#
# Sync waves of the root Application: the platform's Applications (-10),
# then the namespace, the ClusterIssuers, Traefik's settings (#434), the
# Kyverno policy and the observability's alerts and monitors (-5), the
# sealed Secrets (-3), Postgres (-2, #433), the application (0). A wave
# starts once the previous one is Healthy.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../components/argocd
  - ../../components/sealed-secrets
  - ../../components/cert-manager
  - ../../components/traefik
  - ../../components/cloudnative-pg
  - ../../components/kyverno
  - ../../components/app-namespace
  - ../../components/observability

resources:
  - secrets
  - monitoring-secrets
  - postgres.yaml
  - manage-our-home.yaml
