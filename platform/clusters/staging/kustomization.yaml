# What runs on the staging cluster (#432), the home server with 4 GB of
# RAM: rendered by the root Application `platform` (root.yaml), which
# platform/bootstrap.sh applies. The choice of bricks per cluster is the
# list of components below: the observability of #437 does not run here,
# and the DNS-01 issuers on Scaleway's DNS run here only for now (#682):
# the certificate of `staging.watallo.fr` (#683), which no inbound port
# would let an HTTP-01 challenge reach.
#
# Sync waves of the root Application: the platform's Applications (-10),
# Scaleway's DNS-01 webhook (-9), then the namespace, the ClusterIssuers,
# Traefik's settings (#434) and the Kyverno policy (-5), the sealed
# Secrets (-3), Postgres (-2, #433), the application (0). A wave starts
# once the previous one is Healthy.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../components/argocd
  - ../../components/sealed-secrets
  - ../../components/cert-manager
  - ../../components/cert-manager-dns01
  - ../../components/traefik
  - ../../components/cloudnative-pg
  - ../../components/kyverno
  - ../../components/app-namespace

resources:
  - secrets
  - cert-manager-secrets
  - postgres.yaml
  - manage-our-home.yaml
