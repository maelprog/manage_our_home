# The application's Secrets for this cluster, as SealedSecrets (#432):
# `api-secrets`, `migrate-secrets`, those of its Postgres (#433) and
# MinIO's `minio` (#435), the keys listed in README.md ("Secrets"), each sealed with this cluster's
# controller certificate — platform/README.md says how. A SealedSecret
# sealed for another cluster is not readable here, so the files are per
# cluster.
#
# Sealed for the staging server once its Sealed Secrets controller was up
# (platform/README.md, "Amorcer un cluster"). The k3d job cannot open them:
# its root drops them from the render and it seals its own
# (ci/staging-smoke.sh).
#
# Applied by the root Application after the namespace (wave -5) and before
# Postgres (wave -2), whose roles read their passwords here, and the
# application (wave 0), whose migration Job reads `migrate-secrets`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: manage-our-home
commonAnnotations:
  argocd.argoproj.io/sync-wave: "-3"
  # The SealedSecret CRD comes with the controller's Application.
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
resources:
  - api-secrets.yaml
  - migrate-secrets.yaml
  - minio.yaml
  - postgres-app-role.yaml
  - postgres-migration-role.yaml
  - postgres-admin-role.yaml
  - postgres-backup.yaml
