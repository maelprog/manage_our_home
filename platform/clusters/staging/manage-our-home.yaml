# The application on staging (#432): the staging overlay, synced
# automatically — a merge that moves its digests is deployed without
# anyone pressing a button. Last sync wave of the root Application: after
# the platform, the namespace and the sealed Secrets.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: manage-our-home-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/maelprog/manage_our_home.git
    # `k3s` while the k3s epic is integrated there (arbitrage of
    # 2026-10-13); the promotion PR to `deploy` changes it, which
    # ci/render-test.sh requires of a PR to `deploy`.
    targetRevision: k3s
    path: apps/manage-our-home/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    # Created by the platform (components/app-namespace): no
    # CreateNamespace here.
    namespace: manage-our-home
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
